name: Steam Price Snapshot via Playwright

description: Fetches Steam market prices using Playwright and updates JSON snapshots.

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
    inputs:
      item:
        description: "Steam market item to fetch (default: MAG-7 | MAGnitude)"
        required: false
        default: "MAG-7 | MAGnitude"

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run price fetch script
        env:
          PRICE_ITEM: ${{ github.event.inputs.item }}
        run: node scripts/fetch-genesis-prices.mjs
