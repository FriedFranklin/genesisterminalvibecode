name: Auto Update Prices & Wiki

# This workflow runs the price‑scraping script and then pushes the generated wiki.
# It runs on a schedule (every 15 minutes) and also on every push to the main branch.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  push:
    branches: [main]

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run price scraper
        run: node scripts/update-prices.mjs

      - name: Set up Git for wiki push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push wiki
        env:
          REPO_URL: ${{ github.repositoryUrl }}
        run: |
          chmod +x ./scripts/push-wiki.sh
          ./scripts/push-wiki.sh
